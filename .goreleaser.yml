version: 2

project_name: aic

before:
  hooks:
    - go mod tidy

builds:
  - id: aic
    main: .
    binary: aic
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/xdx888999/aic/internal/version.Version={{ .Version }}
      - -X github.com/xdx888999/aic/internal/version.Commit={{ .Commit }}
      - -X github.com/xdx888999/aic/internal/version.BuildTime={{ .Date }}

archives:
  - id: default
    ids:
      - aic
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

brews:
  - name: aic
    repository:
      owner: xdx888999
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/xdx888999/aic
    description: Terminal AI CLI tool manager
    license: MIT
    directory: Formula
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "aic"
    test: |
      assert_match version.to_s, shell_output("#{bin}/aic --version")
    url_template: "https://github.com/xdx888999/aic/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    skip_upload: auto
    commit_msg_template: "Update aic to {{ .Tag }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^refactor:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: xdx888999
    name: aic
  draft: false
  prerelease: auto
  header: |
    `aic` 的新版本发布。

    这是一个终端里的 AI CLI 工具管理器，用于统一查看本机常见 AI CLI 工具的安装状态、当前版本、最新版本和更新源，并在同一个界面里完成升级或打开配置文件。

    ## 下载

    请根据你的系统下载对应资产：

    - macOS Apple Silicon: `aic_darwin_arm64.tar.gz`
    - macOS Intel: `aic_darwin_amd64.tar.gz`
    - Linux amd64: `aic_linux_amd64.tar.gz`
    - Linux arm64: `aic_linux_arm64.tar.gz`

    ## 变更
  footer: |
    ## 安装

    下载并解压对应压缩包后，将 `aic` 放入你的 `PATH` 目录即可直接运行。

    示例：

    ```bash
    mv aic /usr/local/bin/aic
    aic --version
    ```
