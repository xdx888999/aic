version: 2

project_name: aic

before:
  hooks:
    - go mod tidy

builds:
  - id: aic
    main: .
    binary: aic
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/xdx888999/aic/internal/version.Version={{ .Version }}
      - -X github.com/xdx888999/aic/internal/version.Commit={{ .Commit }}
      - -X github.com/xdx888999/aic/internal/version.BuildTime={{ .Date }}

archives:
  - id: default
    ids:
      - aic
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^refactor:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: xdx888999
    name: aic
  draft: false
  prerelease: auto

